<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VUNA-Calc</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <div class="calculator">
    <div class="brand">VUNA</div>

    <div class="display" id="display">0</div>

    <div class="buttons">
      <!-- Row 1: actions -->
      <button class="btn action"   data-value="AC">AC</button>
      <button class="btn action"   data-value="CE">CE</button>
      <button class="btn custom"   data-value="%">% of</button>
      <button class="btn operator" data-value="/">&divide;</button>

      <!-- Row 2 -->
      <button class="btn" data-value="7">7</button>
      <button class="btn" data-value="8">8</button>
      <button class="btn" data-value="9">9</button>
      <button class="btn operator" data-value="*">&times;</button>

      <!-- Row 3 -->
      <button class="btn" data-value="4">4</button>
      <button class="btn" data-value="5">5</button>
      <button class="btn" data-value="6">6</button>
      <button class="btn operator" data-value="-">&minus;</button>

      <!-- Row 4 -->
      <button class="btn" data-value="1">1</button>
      <button class="btn" data-value="2">2</button>
      <button class="btn" data-value="3">3</button>
      <button class="btn operator" data-value="+">+</button>

      <!-- Row 5 -->
      <button class="btn" data-value="0">0</button>
      <button class="btn" data-value=".">.</button>
      <button class="btn equals" data-value="=">=</button>
    </div>
  </div>

  <!-- Load engine first, then UI wiring -->
  <script src="src/calculator.js"></script>
  <script src="src/ui.js"></script>
</body>
</html>
